# ============================================================
# GACP Platform — Host nginx vhost for staging.gacpth.com ON THE DEMO HOST
# ============================================================
# Installed at /etc/nginx/conf.d/staging.gacpth.com.conf on 119.59.105.140
# (AlmaLinux 8, nginx 1.24, conf.d layout — no sites-available/sites-enabled).
# Operator order 164(3), 2026-11-07: the old staging machine is gone, staging
# now shares this host — and this host nginx — with demo.
# Runbook: docs/operations/runbooks/staging-on-demo-host.md
#
# What it shares with demo and what it does not:
#
#   shared   this host nginx process, the Cloudflare real-IP block and the gate
#            maps in conf.d/00-gacp-platform.conf ($gacp_prelaunch_deny, the
#            Stripe webhook exemption, gacp-gate-token.conf), and the origin
#            certificate pair under /etc/ssl/cloudflare/.
#   separate the Docker nginx it forwards to: gacp-staging-nginx at
#            127.0.0.1:8081 (docker-compose.staging-on-demo-host.yml), NOT
#            demo's gacp-nginx at 127.0.0.1:8080. That container sits on the
#            staging slot's own network and can only reach backend-staging /
#            frontend-staging — a request routed by mistake cannot land on a
#            demo container.
#
# Differences from deploy/nginx/staging.gacpth.com.conf (the old staging
# host's copy, kept for history): upstream 8081 instead of 8080, and the
# certificate path this host actually has. Everything else is the same file.
#
# Gate: staging is OUR host. It answers on $gacp_prelaunch_deny and the
# `gacp_gate` cookie (our own token), never on the customer's demo cookie.
#
# Install (root, on the demo host — see the runbook):
#   install -m 644 staging.gacpth.com.conf /etc/nginx/conf.d/staging.gacpth.com.conf
#   restorecon -v /etc/nginx/conf.d/staging.gacpth.com.conf
#   nginx -t && systemctl reload nginx
#
# Reaching 127.0.0.1:8001 / :3001 directly would bypass the Docker nginx
# (rate limits, security headers, gzip, the /api/session/ split). Do not.
#
# SSL: Cloudflare terminates TLS for visitors in mode Full, which accepts this
# origin pair whatever names it carries. Switching to Full (strict) needs a
# certificate that covers staging.gacpth.com — check before switching.

# ---- HTTP → redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name staging.gacpth.com;

    # Pre-launch gate. $gacp_prelaunch_deny and the Cloudflare real-IP
    # restoration it depends on are declared at http scope in
    # conf.d/00-gacp-platform.conf. nginx refuses to start with "unknown
    # variable" if that file is missing, which is the right way to find out.
    if ($gacp_prelaunch_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01. Must precede the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # Inline `http2` on listen, not `http2 on;` — same reason as the demo vhost.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.gacpth.com;

    if ($gacp_prelaunch_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    # Prelaunch-gate cookie door (see $gacp_gate_cookie_ok in
    # 00-gacp-platform.conf). Only the CORRECT token passes the deny map
    # afterwards. access_log off so the token never lands in the access log.
    location = /__gate {
        access_log off;
        add_header Set-Cookie "gacp_gate=$arg_t; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    # The origin pair this host already serves demo with.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    # Own zone name: SSL (00-gacp-platform.conf) and SSL_DEMO are taken.
    ssl_session_cache   shared:SSL_STAGING:10m;

    # HSTS comes from the Docker nginx (nginx/gacp.production.conf) and is not
    # suppressed here, exactly as on demo.

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment "staging" always;

    client_max_body_size 50M;

    # Backend API — to the STAGING slot's Docker nginx (127.0.0.1:8081), which
    # routes /api/session/ to the frontend and everything else under /api/ to
    # backend-staging.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line. The Docker nginx's $host map
        # sends only staging.gacpth.com to backend-staging; any other Host
        # falls to `backend`, which does not exist in the staging slot (502).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Document uploads — served by the backend behind its PDPA gate, through
    # the Docker nginx's own /uploads/ location. Without this block /uploads/*
    # would fall through to the frontend (500).
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line — see /api/ above.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # DO NOT remove or hardcode this line — see /api/ above.
        proxy_set_header Host $host;
        # The public verify page builds the QR origin from x-forwarded-host,
        # allowlisted in apps/web-app/src/lib/verify/public-verify-url.ts.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Block sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }
}
