<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Sukhumvit Set','Sarabun','Noto Sans Thai',Tahoma,system-ui,sans-serif; }
    a { color: #18803f; } a:hover { color: #146333; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #f4f6f5; box-sizing: border-box;">

  <div style="background: #006638; padding: 16px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="color: #ffffff; font-size: 17px; font-weight: 600;">รอบปลูก C-2569-014</div>
  </div>

  <div style="display: flex; background: #ffffff; border-bottom: 1px solid #e9ecef; overflow: hidden;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div style="height: 38px; padding: 0 11px; font-size: 12px; color: {{t.fg}}; border-bottom: 2px solid {{t.bar}}; display: flex; align-items: center; white-space: nowrap;">{{t.name}}</div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">

    <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 12px;">
      <div style="font-size: 13px; font-weight: 600; color: #14261c;">ภาพรวมรอบปลูก</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px;">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
          <div style="background: #f7f9f8; border-radius: 8px; padding: 8px;">
            <div style="font-size: 10px; color: #6b7a71;">{{s.k}}</div>
            <div style="font-size: 14px; font-weight: 600; color: #14261c; margin-top: 2px;">{{s.v}}</div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;">
        <sc-for list="{{acts1}}" as="a" hint-placeholder-count="4">
          <div style="height: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid #cdd6d0; color: #4a5a51; font-size: 11px; display: flex; align-items: center;">{{a}}</div>
        </sc-for>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 13px; font-weight: 600; color: #14261c;">แปลงในรอบนี้</div>
        <div style="height: 26px; padding: 0 8px; border-radius: 8px; background: #18803f; color: #ffffff; font-size: 11px; font-weight: 600; display: flex; align-items: center;">เพิ่มแปลง</div>
      </div>
      <sc-for list="{{plots}}" as="p" hint-placeholder-count="2">
        <div style="border-top: 1px solid #eef1ef; padding-top: 10px; margin-top: 10px;">
          <div style="display: flex; justify-content: space-between;">
            <div style="font-size: 12px; color: #14261c;">{{p.name}}</div>
            <div style="font-size: 11px; color: #6b7a71;">{{p.area}}</div>
          </div>
          <div style="display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap;">
            <sc-for list="{{p.btns}}" as="b" hint-placeholder-count="4">
              <div style="height: 26px; padding: 0 8px; border-radius: 7px; border: 1px solid #cdd6d0; color: #4a5a51; font-size: 10px; display: flex; align-items: center;">{{b}}</div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 12px;">
      <div style="font-size: 13px; font-weight: 600; color: #14261c;">บันทึกกิจกรรมล่าสุด</div>
      <sc-for list="{{logs}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eef1ef; padding: 9px 0 0 0; margin-top: 9px;">
          <div>
            <div style="font-size: 12px; color: #14261c;">{{l.k}}</div>
            <div style="font-size: 10px; color: #6b7a71; margin-top: 2px;">{{l.d}}</div>
          </div>
          <div style="display: flex; gap: 5px;">
            <div style="height: 24px; padding: 0 7px; border-radius: 6px; border: 1px solid #cdd6d0; color: #4a5a51; font-size: 10px; display: flex; align-items: center;">แก้ไข</div>
            <div style="height: 24px; padding: 0 7px; border-radius: 6px; border: 1px solid #e3c2c2; color: #a12626; font-size: 10px; display: flex; align-items: center;">ลบ</div>
          </div>
        </div>
      </sc-for>
      <div style="display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;">
        <sc-for list="{{acts2}}" as="a" hint-placeholder-count="5">
          <div style="height: 30px; padding: 0 9px; border-radius: 8px; background: {{a.bg}}; border: 1px solid {{a.bd}}; color: {{a.fg}}; font-size: 11px; font-weight: 600; display: flex; align-items: center;">{{a.t}}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="margin: 0 16px 20px 16px; border: 1px solid #f0d9a8; background: #fdf7e8; border-radius: 12px; padding: 10px 12px;">
    <div style="font-size: 12px; color: #7a5c17; line-height: 1.5;">73 สิ่งที่กดได้ · 13 ปุ่มดูเด่นพร้อมกัน · ปุ่มเล็กสุด 24px · ช่องตัวเลขไม่เรียกแป้นตัวเลข</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const t = (name, on) => ({ name, fg: on ? '#18803f' : '#6b7a71', bar: on ? '#18803f' : 'transparent' });
    return {
      tabs: [t('ภาพรวม', true), t('แปลง', false), t('กิจกรรม', false), t('เก็บเกี่ยว', false), t('ผลตรวจ', false)],
      stats: [
        { k: 'สถานะ', v: 'กำลังปลูก' }, { k: 'พันธุ์', v: 'หางกระรอก' }, { k: 'จำนวนต้น', v: '500' },
        { k: 'เริ่มปลูก', v: '12 มิ.ย.' }, { k: 'อายุ', v: '90 วัน' }, { k: 'คาดเก็บ', v: '20 ก.ย.' },
      ],
      acts1: ['แก้ไขรอบ', 'ปิดรอบ', 'พิมพ์ QR', 'ส่งออกข้อมูล'],
      plots: [
        { name: 'แปลงเหนือ', area: '1,600 ตร.ม.', btns: ['ดูแปลง', 'บันทึกดูแล', 'ย้ายต้น', 'QR'] },
        { name: 'แปลงใต้', area: '1,600 ตร.ม.', btns: ['ดูแปลง', 'บันทึกดูแล', 'ย้ายต้น', 'QR'] },
      ],
      logs: [
        { k: 'ให้น้ำ', d: '9 ก.ย. 2569 · 08:30' },
        { k: 'ใส่ปุ๋ยอินทรีย์', d: '7 ก.ย. 2569 · 16:10' },
        { k: 'ตรวจโรคพืช', d: '5 ก.ย. 2569 · 09:00' },
      ],
      acts2: [
        { t: 'บันทึกกิจกรรม', bg: '#18803f', bd: '#18803f', fg: '#ffffff' },
        { t: 'บันทึกเก็บเกี่ยว', bg: '#18803f', bd: '#18803f', fg: '#ffffff' },
        { t: 'แนบผลแล็บ', bg: '#ffffff', bd: '#cdd6d0', fg: '#4a5a51' },
        { t: 'ดูไทม์ไลน์', bg: '#ffffff', bd: '#cdd6d0', fg: '#4a5a51' },
        { t: 'ตั้งเตือน', bg: '#ffffff', bd: '#cdd6d0', fg: '#4a5a51' },
      ],
    };
  }
}
</script>
</body>
</html>
