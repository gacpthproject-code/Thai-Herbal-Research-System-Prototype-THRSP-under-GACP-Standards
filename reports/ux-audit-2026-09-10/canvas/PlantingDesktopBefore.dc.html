<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Sukhumvit Set','Sarabun','Noto Sans Thai',Tahoma,system-ui,sans-serif; }
    a { color: #18803f; } a:hover { color: #146333; }
    input { font-family: inherit; }
  </style>
</helmet>
<div style="width: 1440px; height: 980px; background: #f4f6f5; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">
  <div style="height: 56px; background: linear-gradient(135deg, #006638 0%, #1d724c 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#006638" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 3-5 6-5 9a5 5 0 0010 0c0-3-1.5-6-5-9z"/></svg>
      </div>
      <div>
        <div style="color: #ffffff; font-size: 14px; font-weight: 700; line-height: 1.2;">GACP Platform</div>
        <div style="color: rgba(255,255,255,0.7); font-size: 10px;">ระบบรับรองมาตรฐาน GACP</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="height: 32px; padding: 0 4px 0 12px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: #6b7a71;">ยื่นในนาม</span>
        <span style="font-size: 12px; color: #14261c; font-weight: 600;">พงษ์ภูวนาท เจริญผล</span>
        <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #eaf9f0; color: #18803f; font-size: 11px; font-weight: 600; display: flex; align-items: center;">เจ้าของ</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </div>
      <div style="height: 44px; display: flex; align-items: center; gap: 5px; padding: 0 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
        <span style="color: rgba(255,255,255,0.9); font-size: 12px;">EN</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z"/></svg>
      </div>
      <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 6px;">
        <div style="width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.22); color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">พ</div>
        <span style="color: #ffffff; font-size: 13px;">พงษ์ภูวนาท เจริญผล</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1; overflow: hidden; padding: 32px;">
    <div style="max-width: 1280px; margin: 0 auto;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <div style="height: 44px; padding: 0 18px; border-radius: 12px; background: #ffffff; border: 1px solid #e9ecef; display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a5a51" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          <span style="font-size: 14px; color: #14261c;">หน้าหลัก</span>
        </div>
        <span style="font-size: 14px; color: #9fb0a6;">/</span>
        <span style="font-size: 14px; color: #6b7a71;">บันทึกการปลูก</span>
      </div>
      <div style="background: linear-gradient(135deg, #1d724c 0%, #16603f 100%); border-radius: 12px; padding: 22px 26px; position: relative;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="height: 30px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.16); color: #ffffff; font-size: 12px; display: flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>กลับ</div>
          <div style="height: 30px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.16); color: #ffffff; font-size: 12px; display: flex; align-items: center;">ปลูกแล้ว</div>
        </div>
        <div style="position: absolute; right: 26px; top: 22px; display: flex; gap: 8px;">
          <sc-for list="{{heroBtns}}" as="b" hint-placeholder-count="4">
            <div style="height: 36px; padding: 0 13px; border-radius: 9px; background: {{b.bg}}; border: 1px solid rgba(255,255,255,0.35); color: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center;">{{b.t}}</div>
          </sc-for>
        </div>
        <div style="font-size: 26px; font-weight: 700; color: #ffffff; margin-top: 12px;">รอบฤดูฝน</div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 3px;">สวนพงษ์ภูวนาท • 1 แปลง • 1,200 ตร.ม.</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px;">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
            <div style="background: rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px;">
              <div style="font-size: 11px; color: rgba(255,255,255,0.75);">{{s.k}}</div>
              <div style="font-size: 24px; font-weight: 700; color: #ffffff; margin-top: 2px;">{{s.v}}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="margin-top: 16px; background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 20px 24px;">
        <div style="font-size: 15px; font-weight: 600; color: #14261c;">สถานะขั้นตอนการทำงานของรอบปลูก</div>
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="border: 1px solid #eef1ef; border-radius: 10px; padding: 13px 16px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-size: 13px; font-weight: 600; color: #14261c;">{{s.t}}</div>
              <div style="font-size: 12px; color: #9fb0a6; margin-top: 3px;">{{s.d}}</div>
            </div>
            <div style="font-size: 12px; color: {{s.fg}}; font-weight: 600;">{{s.chip}}</div>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 26px; border-bottom: 1px solid #e9ecef; padding: 0 4px;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <div style="height: 42px; font-size: 13px; color: {{t.fg}}; border-bottom: 2px solid {{t.bar}}; display: flex; align-items: center;">{{t.n}}</div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const t = (n, on) => ({ n, fg: on ? '#18803f' : '#6b7a71', bar: on ? '#18803f' : 'transparent' });
    return {
      heroBtns: [
        { t: 'แก้ไขรอบปลูก', bg: 'rgba(255,255,255,0.14)' },
        { t: 'บันทึกกิจกรรม', bg: 'rgba(255,255,255,0.14)' },
        { t: 'รีเฟรช QR', bg: 'rgba(255,255,255,0.14)' },
        { t: 'เก็บเกี่ยว/สร้างลอต', bg: 'rgba(255,255,255,0.28)' },
      ],
      stats: [
        { k: 'จำนวนต้นตามแผน', v: '3,000' }, { k: 'กิจกรรมที่บันทึก', v: '0' },
        { k: 'QR พร้อมใช้', v: '1 / 1' }, { k: 'ลอตที่สร้างแล้ว', v: '0' },
      ],
      steps: [
        { t: '1) บันทึกกิจกรรม', d: 'บันทึกกิจกรรมรายวันเพื่อใช้ตรวจย้อนหลัง', chip: 'ต้องดำเนินการ', fg: '#18803f' },
        { t: '2) สร้าง QR รายแปลง', d: 'พร้อมใช้งาน 1 / 1 แปลง', chip: 'เสร็จแล้ว', fg: '#18803f' },
        { t: '3) เก็บเกี่ยว/สร้างลอต', d: 'ต้องผ่านเงื่อนไขก่อนเริ่มเก็บเกี่ยว', chip: 'ต้องดำเนินการ', fg: '#18803f' },
        { t: '4) ตรวจสอบ Trace', d: 'ระบบ Trace จะพร้อมหลังสร้าง Batch/Lot', chip: 'รอขั้นก่อนหน้า', fg: '#9fb0a6' },
      ],
      tabs: [t('ภาพรวมรอบ', true), t('แปลงและ QR', false), t('กิจกรรมภาคสนาม', false), t('เก็บเกี่ยวและ Trace', false), t('บันทึกระบบ', false)],
    };
  }
}
</script>
</body>
</html>
