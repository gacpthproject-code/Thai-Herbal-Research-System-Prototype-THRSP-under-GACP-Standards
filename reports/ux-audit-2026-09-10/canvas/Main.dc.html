<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Sukhumvit Set','Sarabun','Noto Sans Thai',Tahoma,system-ui,sans-serif; }
    a { color: #18803f; } a:hover { color: #146333; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #f4f6f5; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="background: #006638; padding: 16px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="color: #ffffff; font-size: 17px; font-weight: 600;">การชำระเงิน</div>
  </div>

  <div style="padding: 20px 16px 0 16px;">
    <div style="font-size: 13px; color: #6b7a71;">ตอนนี้คุณต้องชำระ</div>
    <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 6px;">
      <div style="font-size: 40px; font-weight: 700; color: #14261c; letter-spacing: -0.5px;">3,035</div>
      <div style="font-size: 17px; font-weight: 600; color: #4a5a51;">บาท</div>
    </div>
    <div style="font-size: 13px; color: #a12626; margin-top: 6px; display: flex; align-items: center; gap: 6px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a12626" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16h.01"/></svg>
      เลยกำหนดชำระมา 5 วัน
    </div>
  </div>

  <div style="margin: 16px; background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 14px 16px;">
    <div style="font-size: 14px; font-weight: 600; color: #14261c;">งวดที่ 1 — ค่าตรวจเอกสาร</div>
    <div style="font-size: 12px; color: #6b7a71; margin-top: 3px;">คำขอ APP-68-001</div>
    <div style="height: 1px; background: #eef1ef; margin: 12px 0;"></div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4a5a51;">
      <div>ค่าธรรมเนียมภาครัฐ</div><div style="font-variant-numeric: tabular-nums;">2,500.00</div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4a5a51; margin-top: 5px;">
      <div>ค่าบริการแพลตฟอร์ม</div><div style="font-variant-numeric: tabular-nums;">535.00</div>
    </div>
  </div>

  <div style="padding: 0 16px;">
    <button type="button" onClick="{{pay}}" style="width: 100%; height: 56px; border: 0; border-radius: 12px; background: {{payBg}}; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <sc-if value="{{busy}}" hint-placeholder-val="{{false}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" style="animation: spin 0.9s linear infinite;"><path d="M21 12a9 9 0 11-6.2-8.6"/></svg>
      </sc-if>
      {{payLabel}}
    </button>
    <div style="text-align: center; font-size: 12px; color: #6b7a71; margin-top: 10px; line-height: 1.6;">ชำระผ่านบัตรเครดิต/เดบิต<br>ระบบจะออกใบเสร็จให้อัตโนมัติเมื่อชำระสำเร็จ</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 16px;">
    <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px;">
      <div onClick="{{toggle}}" style="height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <div style="font-size: 14px; color: #4a5a51;">รายการอื่นและเอกสาร</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7a71" stroke-width="2" stroke-linecap="round" style="transform: rotate({{caret}}deg);"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
        <div style="border-top: 1px solid #eef1ef; padding: 4px 0;">
          <sc-for list="{{others}}" as="o" hint-placeholder-count="3">
            <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
              <div>
                <div style="font-size: 13px; color: #14261c;">{{o.title}}</div>
                <div style="font-size: 11px; color: #6b7a71; margin-top: 2px;">{{o.meta}}</div>
              </div>
              <div style="font-size: 12px; color: {{o.fg}}; font-weight: 600;">{{o.state}}</div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"open":{"editor":"boolean","default":false,"section":"สาธิต"}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { busy: false, open: null }; }
  renderVals() {
    const open = this.state.open === null ? (this.props.open ?? false) : this.state.open;
    const busy = this.state.busy;
    return {
      busy,
      payLabel: busy ? 'กำลังเปิดหน้าชำระเงิน' : 'ชำระเงิน 3,035 บาท',
      payBg: busy ? '#146333' : '#18803f',
      pay: () => { this.setState({ busy: true }); setTimeout(() => this.setState({ busy: false }), 1600); },
      open, caret: open ? 180 : 0,
      toggle: () => this.setState({ open: !open }),
      others: [
        { title: 'งวดที่ 2 — ค่าตรวจประเมินแปลง', meta: 'ยังไม่ถึงกำหนด', state: 'รอ', fg: '#6b7a71' },
        { title: 'งวดที่ 1 — คำขอ APP-68-002', meta: 'ชำระแล้ว 28 ส.ค. 2569', state: 'ใบเสร็จ', fg: '#18803f' },
        { title: 'ใบเสนอราคาทั้งหมด', meta: '3 ฉบับ', state: 'ดู', fg: '#18803f' },
      ],
    };
  }
}
</script>
</body>
</html>
