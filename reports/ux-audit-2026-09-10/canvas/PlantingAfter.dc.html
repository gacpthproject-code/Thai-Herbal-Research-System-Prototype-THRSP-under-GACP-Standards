<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Sukhumvit Set','Sarabun','Noto Sans Thai',Tahoma,system-ui,sans-serif; }
    a { color: #18803f; } a:hover { color: #146333; }
    input { font-family: inherit; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #f4f6f5; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="background: #006638; padding: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div>
        <div style="color: #ffffff; font-size: 17px; font-weight: 600;">แปลงเหนือ</div>
        <div style="color: rgba(255,255,255,0.72); font-size: 12px; margin-top: 1px;">หางกระรอก · ปลูกมาแล้ว 90 วัน</div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 16px 0 16px;">
    <div style="font-size: 13px; color: #6b7a71;">วันนี้ยังไม่ได้บันทึก</div>
    <div style="font-size: 22px; font-weight: 700; color: #14261c; margin-top: 4px;">บันทึกการให้น้ำ</div>
  </div>

  <div style="margin: 16px; background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px;">
    <label style="display: block; font-size: 13px; font-weight: 600; color: #14261c;">ปริมาณน้ำ</label>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
      <input type="number" inputMode="decimal" value="{{amount}}" onInput="{{setAmount}}" placeholder="เช่น 120"
        style="flex-grow: 1; height: 56px; padding: 0 14px; border: 1.5px solid {{ring}}; border-radius: 12px; font-size: 20px; font-weight: 600; color: #14261c; outline: none; box-sizing: border-box; -moz-appearance: textfield;">
      <div style="font-size: 15px; color: #4a5a51; font-weight: 600;">ลิตร</div>
    </div>
    <div style="font-size: 12px; color: #6b7a71; margin-top: 8px;">แป้นตัวเลขจะเด้งขึ้นมาเอง ไม่ต้องสลับแป้นพิมพ์</div>

    <div style="height: 1px; background: #eef1ef; margin: 16px 0;"></div>

    <label style="display: block; font-size: 13px; font-weight: 600; color: #14261c;">เวลาที่ให้น้ำ</label>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <div onClick="{{s.pick}}" style="flex-grow: 1; height: 48px; border-radius: 12px; border: 1.5px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer;">{{s.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 0 16px;">
    <button type="button" onClick="{{save}}" style="width: 100%; height: 56px; border: 0; border-radius: 12px; background: {{saveBg}}; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <sc-if value="{{saving}}" hint-placeholder-val="{{false}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.2-8.6"/></svg>
      </sc-if>
      {{saveLabel}}
    </button>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 16px;">
    <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px;">
      <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <div style="font-size: 14px; color: #4a5a51;">บันทึกอย่างอื่น</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7a71" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="border-top: 1px solid #eef1ef; height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <div style="font-size: 14px; color: #4a5a51;">ประวัติรอบปลูกนี้</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7a71" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
    <div style="text-align: center; font-size: 12px; color: #6b7a71; margin-top: 12px; line-height: 1.6;">1 งานหลัก · ทุกเป้ากด 48px ขึ้นไป<br>เหลือสิ่งที่กดได้ 7 จาก 73</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { amount: '', slot: 'morning', saving: false, done: false }; }
  renderVals() {
    const { amount, slot, saving, done } = this.state;
    const mk = (id, label) => ({
      label, pick: () => this.setState({ slot: id }),
      bd: slot === id ? '#18803f' : '#cdd6d0',
      bg: slot === id ? '#eaf9f0' : '#ffffff',
      fg: slot === id ? '#18803f' : '#4a5a51',
    });
    return {
      amount, ring: amount ? '#18803f' : '#cdd6d0',
      setAmount: (e) => this.setState({ amount: e.target.value }),
      slots: [mk('morning', 'เช้า'), mk('noon', 'กลางวัน'), mk('evening', 'เย็น')],
      saving,
      saveBg: saving ? '#146333' : (done ? '#146333' : '#18803f'),
      saveLabel: saving ? 'กำลังบันทึก' : (done ? 'บันทึกแล้ว' : 'บันทึก'),
      save: () => { this.setState({ saving: true }); setTimeout(() => this.setState({ saving: false, done: true }), 1400); },
    };
  }
}
</script>
</body>
</html>
