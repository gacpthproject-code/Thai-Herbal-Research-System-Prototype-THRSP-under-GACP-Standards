name: Production Topology Guard

on:
  pull_request:
    paths:
      - 'docker-compose.production.yml'
      - 'deploy/nginx/**'
      - 'nginx/gacp.production.conf'
      - 'docs/network-diagram.md'
      - 'docs/standards/architecture-nginx-rule.md'
      - 'docs/standards/production-infrastructure-standard.md'
      - 'scripts/ci/check-production-topology.js'
      - 'scripts/ci/check-access-allowlist.js'
      - 'scripts/deploy-do.ps1'
  push:
    branches:
      - main
    paths:
      - 'docker-compose.production.yml'
      - 'deploy/nginx/**'
      - 'nginx/gacp.production.conf'
      - 'docs/network-diagram.md'
      - 'docs/standards/architecture-nginx-rule.md'
      - 'docs/standards/production-infrastructure-standard.md'
      - 'scripts/ci/check-production-topology.js'
      - 'scripts/ci/check-access-allowlist.js'
      - 'scripts/deploy-do.ps1'

jobs:
  topology-guard:
    name: Production Topology Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production topology
        run: node scripts/ci/check-production-topology.js

      - name: Validate pre-launch access gate
        run: node scripts/ci/check-access-allowlist.js
