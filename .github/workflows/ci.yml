  # ERP Regression Gate — flipped to REQUIRED on 2026-05-04 (Wave G).
  # Three blockers were resolved together:
  #   1. seed-gacp.js now seeds an active Certificate for the ERP test
  #      farm (commit `bcbbf39`) — unblocks createCycle auto-link,
  #      plant-units/generate validateCertificate, and harvest-batches
  #      cycle.certificateId guard.
  #   2. routes/api/index.js mounted cultivation/plant-units.js at
  #      `/plant-units` even though the file's routes use absolute paths
  #      (`/planting-cycles/:cycleId/plant-units`, `/plant-units/qr/...`).
  #      Re-mounted at `/` so all routes resolve correctly.
  #   3. The `/admin` namespace is gated behind
  #      `ENABLE_PROVIDER_LEGACY_ALIAS=true` in routes/api/index.js:210.
  #      Set the env var below so the gate's admin read-only check works.
  #
  # All three reproduced locally with postgres + the gate running clean
  # ("[planting-erp] PASS" + "[verify-upload-integration] PASS") before
  # this commit. Reverting either the seed or the route fix will surface
  # immediately on the next PR.
  erp-regression:
    name: ERP Regression Gate
    runs-on: [self-hosted, linux]
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gacp
          POSTGRES_PASSWORD: ci-test-only-not-production
          POSTGRES_DB: gacp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://gacp:ci-test-only-not-production@localhost:5432/gacp_db
        run: npx prisma migrate deploy

      - name: Seed MOPH identities
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://gacp:ci-test-only-not-production@localhost:5432/gacp_db
        run: node prisma/seed-gacp.js

      - name: Start backend server
        working-directory: apps/backend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://gacp:ci-test-only-not-production@localhost:5432/gacp_db
          REDIS_URL: redis://localhost:6379
          PUBLIC_TRACE_URL: http://localhost:5000/api/trace
          JWT_SECRET: test-secret-key-for-workflow
          NODE_ENV: test
          ENABLE_E2E_ROUTES: "true"
          # validate-health-planting-flow.js exercises /api/admin/planting-cycles/:id
          # (provider read-only verification step). The /admin namespace is gated
          # behind ENABLE_PROVIDER_LEGACY_ALIAS in routes/api/index.js — required
          # here so the gate can verify the admin read-only contract.
          ENABLE_PROVIDER_LEGACY_ALIAS: "true"
        run: |
          node server.js > server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          cat server.log
          exit 1

      - name: Run required ERP E2E scripts
        env:
          BASE_URL: http://localhost:5000/api
          PUBLIC_BASE_URL: http://localhost:5000
          ERP_GATE_RETRIES: "2"
        run: node scripts/test/run-regression-gate.js

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-regression-backend-log
          path: apps/backend/server.log

  # Security Audit — gating since Iter W2 (2026-05-17).
  #
  # Previously this job ran `npm audit --audit-level=high` from
  # `apps/backend`. That failed every run with `ENOLOCK — This command
  # requires an existing lockfile` because this repo is a pnpm workspace
  # (the lockfile lives at the repo root as `pnpm-lock.yaml`; per-workspace
  # package-lock.json files do not exist). The job was kept advisory
  # (`continue-on-error: true`), so the broken invocation was effectively
  # a no-op — supply-chain CVEs could land on `main` undetected.
  #
  # W2 fix: run `pnpm audit --audit-level=high` at the repo root (covers
  # all workspaces in a single pass) and remove `continue-on-error`. See
  # docs/operations/security-ci-policy.md for the override procedure and
  # the accepted-residuals catalogue.
  security:
    name: Security Audit
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The exception guard runs FIRST and without network: if someone has
      # suppressed an advisory in pnpm.auditConfig.ignoreCves without a
      # documented, in-date record in security/vulnerability-exceptions.json,
      # the job fails here — before the audit itself has a chance to come
      # back green off the back of that suppression.
      - name: Validate vulnerability exceptions (expiry + justification)
        run: node scripts/ci/check-vulnerability-exceptions.js

      - name: Run pnpm audit (workspace-wide, gating)
        run: pnpm audit --audit-level=high

  # Runtime Readiness validates code-quality / structural readiness
  # (orphan API, prisma schema, monitoring config, security headers,
  # docs). Production-host-only artifacts (.env.production, SSL certs,
  # docker-compose.production.yml validity, the backend test suite that
  # requires DATABASE_URL at module load) are skipped via --ci-mode and
  # validated on the production host as part of deploy.
  runtime-readiness:
    name: Runtime Readiness
    runs-on: [self-hosted, linux]
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Provision local readiness assets
        run: node scripts/deploy/provision-local-production-assets.js

      - name: Run production readiness checks (CI subset)
        run: node scripts/ci/production-readiness-check.js --ci-mode

  # Detect Prisma schema drift — i.e. any difference between the committed
  # migration history under apps/backend/prisma/migrations and the Prisma
  # schema under apps/backend/prisma/schema. A non-zero exit means the
  # schema was changed without a corresponding migration.
  #
  # Wave C cleanup (PR #144) shipped a reconciliation migration that
  # closed the long-standing drift. With drift = 0 since 2026-05-02 this
  # job is now required (no longer continue-on-error). If a future
  # schema change drifts, the drift-cleanup workflow in
  # apps/backend/scripts/idempotify-drift.js + create-shadow-db.js +
  # apply-reconcile-test.js can regenerate a reconcile migration in
  # minutes — see PR #144 for the playbook.
  migration-drift-check:
    name: Migration Drift Check
    runs-on: [self-hosted, linux]
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: drift
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Detect schema drift
        working-directory: apps/backend
        env:
          # migrate diff needs a shadow database to apply --from-migrations
          # against; reuse the postgres service container for that.
          DATABASE_URL: postgresql://drift:drift@localhost:5432/drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

  build-success:
    name: Build Success
    runs-on: [self-hosted, linux]
    # e2e is intentionally excluded — the e2e job is `continue-on-error: true`
    # so it is advisory by design. Including it in `needs:` would still skip
    # build-success when e2e fails (continue-on-error keeps the workflow run
    # green but the JOB conclusion stays `failure`, which `needs:` treats as
    # "did not succeed" → downstream skipped). When e2e is stabilised, drop
    # its continue-on-error and add it back here.
    # migration-drift-check is now required (PR #144 reconciled the drift
    # to 0) — included so a future schema change without a migration
    # blocks merge instead of accumulating tech debt silently.
    needs: [lint, lint-frontend, mock-journeys, workflow-paths-check, enforcement-guardrails, test, auth-hardening, bi-integrity, ux-ui-baseline, security, runtime-readiness, migration-drift-check, erp-regression, flutter]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"

  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux]
    needs: test
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gacp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        # Run via the workspace package that owns @playwright/test (gacp-backend)
        # so the binary resolves regardless of hoisting. We keep
        # --ignore-scripts on the workspace install above for supply-chain
        # safety; this step is the explicit, scoped Playwright bootstrap.
        run: pnpm --filter gacp-backend exec playwright install --with-deps

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate --schema prisma/schema

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gacp_test
        run: npx prisma migrate deploy

      - name: Start backend server
        working-directory: apps/backend
        env:
          PORT: 3000
          DATABASE_URL: postgresql://test:test@localhost:5432/gacp_test
          REDIS_URL: redis://localhost:6379
          PUBLIC_TRACE_URL: http://localhost:3000/api/trace
          JWT_SECRET: test-secret-key-for-e2e
          NODE_ENV: test
          ENABLE_E2E_ROUTES: "true"
        run: |
          node server.js > server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          cat server.log
          exit 1

      - name: Run E2E Tests
        continue-on-error: true
        working-directory: apps/backend
        env:
          NODE_ENV: test
          API_URL: http://localhost:3000
        run: npx playwright test --reporter=list

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: apps/backend/server.log

  # ─────────────────────────────────────────────
  # Auto-deploy main → staging (so every merge gets exercised end-to-end
  # before it can be promoted to deploy/production)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, linux]
    needs: [build-success]
    # §0 NO-AUTO-DEPLOY (operator mandate 2026-08-04): staging deploy is
    # MANUAL only — never on push. A push to main no longer SSHes to the host.
    # Run it from the Actions tab (workflow_dispatch) when the operator wants a
    # staging build. This also stops the perpetual "main red" that masked real
    # gate failures (the job failed on every push at the SSH-connect step).
    if: github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      # main-latest on a push to main; whatever the operator asked for on a
      # manual run. `promote-deploy-branch` stays push-only, so a dispatch can
      # exercise staging without ever advancing deploy/production.
      STAGING_IMAGE_TAG: ${{ github.event.inputs.image_tag || 'main-latest' }}

    steps:
      # When the deploy host secret is not configured, skip the staging deploy
      # gracefully instead of hard-failing on appleboy/ssh-action's "missing
      # server host" — a perpetual false-failure that otherwise blocks the
      # promote → deploy/production step. Secrets can't be read in `if:`
      # directly, so presence is surfaced via a step output.
      - name: Check deploy host configured
        id: cfg
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PRODUCTION_HOST secret is not set — skipping staging deploy (not a failure). Set it to enable the staging gate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH (delegates to scripts/deploy/deploy-staging.sh)
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: STAGING_IMAGE_TAG
          script: |
            # Same droplet, separate slot. The staging deploy script targets
            # the `gacp_staging` database and 127.0.0.1:8001 / :3001 ports.
            # Reads /opt/gacp-platform/.env.staging — must exist before this
            # job runs for the first time (see docs/operations/staging-activation.md).
            IMAGE_TAG="${STAGING_IMAGE_TAG:-main-latest}" /opt/gacp-platform/scripts/deploy/deploy-staging.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed — review SSH script logs and /var/log/gacp-deploys/staging-*.log on the host"

  # ─────────────────────────────────────────────
  # Promote main → deploy/production (main branch only)
  # ─────────────────────────────────────────────
  promote-deploy-branch:
    name: Promote main → deploy/production
    runs-on: [self-hosted, linux]
    # Only promote AFTER staging accepted the build. This catches deploy-time
    # regressions (env-var validation failures, missing GHCR image, prisma
    # migration failures) before the same code lands on deploy/production.
    needs: [build-success, deploy-staging]
    # §0 NO-AUTO-DEPLOY: advancing deploy/production must be an EXPLICIT operator
    # action, never an automatic consequence of a push to main. Disabled here
    # pending the A11 deploy-pipeline ADR, which will define who promotes, on
    # what criteria, and how it ties to the freeze / Tier C. Do not re-enable a
    # push trigger without that ADR.
    if: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fast-forward deploy/production to main (if possible)
        run: |
          git fetch origin deploy/production
          git checkout deploy/production
          if git merge-base --is-ancestor HEAD origin/main; then
            git merge --ff-only origin/main
            git push origin deploy/production
            echo "✅ deploy/production fast-forwarded to main"
          else
            echo "⚠️  deploy/production has commits not on main — opening PR instead"
            BRANCH="auto/promote-main-to-deploy-${{ github.sha }}"
            git checkout -b "$BRANCH"
            git merge --no-ff origin/main -m "Merge main into deploy/production (auto-promote $GITHUB_SHA)"
            git push origin "$BRANCH"
            gh pr create --base deploy/production --head "$BRANCH" \
              --title "auto: promote main → deploy/production" \
              --body "Automatic promotion gated by CI; review for any production-only conflicts before merge."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production deploy lives in .github/workflows/production.yml.
  #
  # The previous `deploy` job here was unreachable: ci.yml only triggers
  # on push to [main, develop] (see `on.push.branches` at the top of
  # this file), but the job's condition was
  # `if: github.ref == 'refs/heads/deploy/production'` — that ref can
  # never be the trigger source for ci.yml, so the job never ran.
  #
  # It also referenced `secrets.SSH_PRIVATE_KEY` while the rest of the
  # deploy plumbing uses `secrets.PRODUCTION_SSH_KEY`, two slightly
  # different shapes for the same intent — neither one wired
  # end-to-end through this workflow.
  #
  # production.yml runs the same release-test gate as a required
  # upstream, builds GHCR images, and SSH-deploys via
  # scripts/deploy/deploy-production.sh. Keeping the deploy logic in
  # one workflow avoids the silent drift that made this job dead in
  # the first place.
  #
  # 2026-08-13: production.yml is now `workflow_dispatch` ONLY. It used
  # to also trigger on push to deploy/production and on v* tags, which
  # contradicted the §0 NO-AUTO-DEPLOY rule stated on the promote job
  # above — that rule was enforced here by `if: false` but not there,
  # so deploy/production still had a live automatic path. The branch
  # exists on origin, so this was reachable, and the deploy recreates
  # the nginx container that staging shares.
  # See reports/risk-assessment/2026-08-13.md §4 R1.
